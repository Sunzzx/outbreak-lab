[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outbreak-lab"
version = "0.1.0"
description = "Reproducible stochastic SIR simulator and intervention counterfactuals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ayush Kandwal"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
outbreak-demo = "outbreak_lab.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
